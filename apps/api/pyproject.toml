[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goldenloop-api"
version = "0.1.0"
description = "Local synthetic GoldenLoop evaluation workbench API"
requires-python = ">=3.12"
dependencies = [
  "goldenloop-eval==0.1.0",
  "goldenloop-demo-agent==0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["src/goldenloop_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
