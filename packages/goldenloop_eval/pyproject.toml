[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "goldenloop-eval"
version = "0.1.0"
description = "Canonical cases and fail-closed evaluation for GoldenLoop"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
live = ["openai>=2.25,<4", "azure-identity>=1.25.3,<2"]

[project.scripts]
goldenloop-eval = "goldenloop_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldenloop_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
